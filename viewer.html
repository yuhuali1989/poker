<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Model Viewer</title>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0c0d14; }
  #stage { width: 100vw; height: 100vh; display: block; }
  #hud {
    position: fixed; left: 16px; top: 14px; z-index: 5; color: #f5c451;
    font: 13px/1.7 "Microsoft YaHei", sans-serif; padding: 8px 14px;
    background: rgba(8,12,20,.72); border: 1px solid rgba(245,196,81,.35); border-radius: 8px;
  }
  #hud b { font-size: 15px; }
  #hud span { color: #a9b7cd; font-size: 11px; }
  #err { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
    color: #ffb4c4; font: 14px "Microsoft YaHei", sans-serif; display: none; }
</style>
</head>
<body>
<div id="hud"><b>🎲 金鳄会 · 3D 荷官模型</b><br><span>拖拽旋转 · 滚轮缩放 · 自动环绕</span></div>
<div id="err">模型文件尚未就绪（public/models/dealer.glb）</div>
<canvas id="stage"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/GLTFLoader.js';
import { OrbitControls } from './vendor/OrbitControls.js';

const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0d14);
scene.fog = new THREE.FogExp2(0x0c0d14, .035);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, .1, 100);
camera.position.set(0, 2.1, 6.2);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1.35, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.4;
controls.minDistance = 3;
controls.maxDistance = 12;

scene.add(new THREE.AmbientLight(0x9aa8c8, 1.3));
const key = new THREE.SpotLight(0xffd9a4, 90, 20, Math.PI / 4, .6);
key.position.set(-3, 6, 4); key.castShadow = true; scene.add(key);
const rim = new THREE.PointLight(0xffae72, 30, 14);
rim.position.set(3, 3, -3); scene.add(rim);
const fill = new THREE.DirectionalLight(0xbfd0ff, 1.1);
fill.position.set(2, 4, 5); scene.add(fill);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(3.2, 64),
  new THREE.MeshStandardMaterial({ color: 0x241a22, roughness: .85 })
);
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const ring = new THREE.Mesh(
  new THREE.TorusGeometry(1.5, .02, 8, 80),
  new THREE.MeshBasicMaterial({ color: 0xf5c451, transparent: true, opacity: .5 })
);
ring.rotation.x = -Math.PI / 2; ring.position.y = .01; scene.add(ring);

new GLTFLoader().load('models/dealer.glb', (gltf) => {
  const m = gltf.scene || gltf.scenes[0];
  const b = new THREE.Box3().setFromObject(m);
  const size = new THREE.Vector3(); b.getSize(size);
  m.scale.setScalar(3.0 / Math.max(.001, size.y));
  const b2 = new THREE.Box3().setFromObject(m);
  const c = new THREE.Vector3(); b2.getCenter(c);
  m.position.set(-c.x, -b2.min.y, -c.z);
  m.rotation.y = 0;   // GLB 正面朝 +Z，默认视角即正面
  m.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true; o.receiveShadow = true;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(mm => { if (mm && mm.map) mm.map.colorSpace = THREE.SRGBColorSpace; });
    }
  });
  scene.add(m);
}, undefined, () => { document.getElementById('err').style.display = 'block'; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
